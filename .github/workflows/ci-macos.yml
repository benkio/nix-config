name: macOS CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install nix
        env:
          NIX_FIRST_BUILD_UID: "331"
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install omnix
        run: nix profile install github:NixOS/nixpkgs/nixpkgs-unstable#omnix

      - name: Nix formatting check
        run: nix run nixpkgs#nixfmt -- --check $(git ls-files '*.nix')

      - name: Secrets scan
        run: nix run nixpkgs#gitleaks -- dir . --no-banner --redact --config .gitleaks.toml

      - name: Home-manager macOS build
        run: nix build .#homeConfigurations.benkio@macos.activationPackage

      - name: Darwin configuration build
        run: nix build .#darwinConfigurations.macos.system
