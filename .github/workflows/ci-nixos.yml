name: NixOS CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test-nixos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - name: Install omnix
        run: nix profile install nixpkgs#omnix

      - name: Nix formatting check
        run: nix run nixpkgs#nixfmt -- --check $(git ls-files '*.nix')

      - name: Secrets scan
        run: nix run nixpkgs#gitleaks -- dir . --no-banner --redact --config .gitleaks.toml

      - name: Provide CI hardware configuration
        run: |
          sudo mkdir -p /etc/nixos
          sudo tee /etc/nixos/hardware-configuration.nix >/dev/null <<'EOF'
          { ... }:
          {
            fileSystems."/" = {
              device = "none";
              fsType = "tmpfs";
            };
            fileSystems."/boot" = {
              device = "none";
              fsType = "vfat";
            };
            swapDevices = [ ];
          }
          EOF

      - name: Home-manager NixOS build
        run: nix build .#homeConfigurations.benkio@nixos.activationPackage

      - name: NixOS system build
        run: nix build --dry-run --impure .#nixosConfigurations.nixos.config.system.build.toplevel
